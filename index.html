<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Intensity Index Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ─── PRINT STYLES (popup window handles its own CSS) ────────── */
#pdf-print { display: none; }
</style>
<style>
/* ─── TOKENS ──────────────────────────────────────────────── */
:root {
  --accent:    #1a73e8;
  --accent2:   #4a9eff;
  --accent-bg: rgba(26,115,232,0.1);
  --danger:    #c0392b;
  --danger2:   #e74c3c;
  --green2:    #22c55e;
  --mono:   'DM Mono', monospace;
  --head:   'Barlow Condensed', sans-serif;
  --body:   'Barlow', sans-serif;
  --r:  10px;
  --rl: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #0c0c0e;
    --surf:    #141416;
    --surf2:   #1c1c1f;
    --border:  #2a2a2e;
    --text:    #f0f0f5;
    --muted:   #888;
    --muted2:  #444;
    --ph:      #3a3a3e;
  }
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:      #f0f2f5;
    --surf:    #ffffff;
    --surf2:   #f5f6f9;
    --border:  #c8cdd8;
    --text:    #0e0f11;
    --muted:   #6b7280;
    --muted2:  #b8bec9;
    --ph:      #aaa;
  }
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:16px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  transition: background .2s, color .2s;
}
button { cursor:pointer; border:none; background:none; font-family:inherit; }
input  { font-family:inherit; }

/* ─── APP SHELL ───────────────────────────────────────────── */
#app {
  width:100%;
  max-width:1440px;
  margin:0 auto;
  padding:.75rem 1.25rem .75rem;
  /* On desktop: fill viewport height and don't scroll */
  display:flex;
  flex-direction:column;
  height:100dvh;
}
@media(max-width:860px) {
  #app { height:auto; min-height:100dvh; padding:.75rem 1rem 3rem; overflow-y:auto; }
}

/* ─── TOP BAR ─────────────────────────────────────────────── */
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.75rem;
  flex-wrap:wrap;
  margin-bottom:.6rem;
  flex-shrink:0;
}
.topbar-title { display:flex; flex-direction:column; gap:4px; }
.topbar h1 {
  font-family: var(--head);
  font-size: clamp(1.3rem, 3.5vw, 2rem);
  font-weight:800;
  letter-spacing:.02em;
  text-transform:uppercase;
  line-height:1;
  white-space:nowrap;
}
.topbar-byline {
  font-family: var(--mono);
  font-size:.67rem;
  letter-spacing:.1em;
  color: var(--muted);
  text-transform:uppercase;
  line-height:1;
}
.topbar-right { display:flex; align-items:center; gap:.55rem; flex-wrap:wrap; }
#fixturePill {
  display:none;
  font-family: var(--mono);
  font-size:.7rem;
  letter-spacing:.05em;
  color: var(--accent2);
  background: var(--accent-bg);
  border:1px solid rgba(74,158,255,.3);
  padding:5px 12px;
  border-radius:7px;
  max-width:380px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
@media(max-width:860px) {
  #fixturePill { display:none !important; }
}
.icon-btn {
  font-family: var(--head);
  font-size:.73rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:5px 12px;
  border-radius:7px;
  border:1px solid var(--border);
  color: var(--muted);
  background: var(--surf);
  transition: border-color .15s, color .15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ─── FIXTURE PANEL ───────────────────────────────────────── */
.fx-panel {
  background: var(--surf);
  border:1px solid var(--border);
  border-radius: var(--rl);
  overflow:hidden;
  margin-bottom:.6rem;
  flex-shrink:0;
  max-height:600px;
  opacity:1;
  transition: max-height .35s ease, opacity .28s ease, margin .28s ease, border-color .28s;
}
.fx-panel.collapsed {
  max-height:0;
  opacity:0;
  margin-bottom:0;
  border-color:transparent;
  pointer-events:none;
}
.fx-inner { padding:.95rem 1.15rem .6rem; }
.fx-grid {
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;
  gap:.6rem;
  align-items:end;
}
@media(max-width:680px) {
  .fx-grid { grid-template-columns:1fr 1fr; align-items:end; }
  .fx-comp { grid-column:1/-1; }
  .fx-save-cell { grid-column:1/-1; }
}
.fx-save-cell { display:flex; flex-direction:column; }
.btn-save {
  font-family: var(--head);
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.46rem 1rem;
  border-radius:7px;
  background: var(--accent);
  color:#fff;
  border:1px solid var(--accent);
  transition:filter .15s;
  white-space:nowrap;
  height:100%;
  width:100%;
}
.btn-save:hover { filter:brightness(1.1); }
.field label {
  display:block;
  font-family: var(--mono);
  font-size:.6rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color: var(--muted);
  margin-bottom:3px;
}
.field input {
  width:100%;
  background: var(--surf2);
  border:1px solid var(--border);
  color: var(--text);
  font-size:.87rem;
  padding:.46rem .72rem;
  border-radius: var(--r);
  outline:none;
  transition:border-color .18s;
  -webkit-appearance:none;
  appearance:none;
  height: 2.1rem;
  box-sizing:border-box;
}
.field input:focus { border-color: var(--accent); }
.field input::placeholder { color: var(--ph); }

/* ─── SECTION LABEL ───────────────────────────────────────── */
.sl {
  font-family: var(--head);
  font-size:.63rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color: var(--muted);
  margin-bottom:.7rem;
  display:flex;
  align-items:center;
  gap:.5rem;
}
.sl::after { content:''; flex:1; height:1px; background: var(--border); }

/* ─── CARD ─────────────────────────────────────────────────── */
.card {
  background: var(--surf);
  border:1px solid var(--border);
  border-radius: var(--rl);
  padding:1rem 1.15rem;
  animation: cardIn .35s ease both;
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
/* Stagger left column cards */
.col-l .card:nth-child(1) { animation-delay:.05s; }
.col-l .card:nth-child(2) { animation-delay:.12s; }
.col-l .card:nth-child(3) { animation-delay:.19s; }
/* Stagger right column cards */
.col-r .card:nth-child(1) { animation-delay:.08s; }
.col-r .card:nth-child(2) { animation-delay:.16s; }
.col-r .card:nth-child(3) { animation-delay:.22s; }
/* Don't animate on mobile stacked layout to avoid jarring effect */
@media(max-width:860px) {
  .card { animation-delay:0s !important; animation-duration:.25s; }
}

/* ─── MAIN GRID ────────────────────────────────────────────── */
.main-grid {
  display:grid;
  grid-template-columns:300px 1fr;
  gap:.75rem;
  align-items:stretch;
  flex:1;          /* fill remaining height inside #app flex column */
  min-height:0;    /* allow shrinking below content size */
  overflow:hidden;
}
@media(max-width:860px) {
  .main-grid { grid-template-columns:1fr; align-items:start; flex:none; overflow:visible; }
}
.col-l, .col-r { display:flex; flex-direction:column; gap:.75rem; min-height:0; }
/* Chart card grows to fill remaining height in right col */
.col-r { height:100%; }
.col-r .card.chart-card { flex:1; display:flex; flex-direction:column; min-height:0; }
.col-r .card.chart-card .chart-wrap { flex:1; height:auto; min-height:0; }
/* Key Actions card grows to fill remaining height in left col */
.col-l { height:100%; }
.col-l .card.actions-card { flex:1; display:flex; flex-direction:column; min-height:0; }
.col-l .card.actions-card .opp-btn { flex:1; min-height:44px; }

/* ─── TIMER ────────────────────────────────────────────────── */
.timer-row {
  display:flex;
  flex-direction:column;
  gap:.65rem;
  width:100%;
}
.timer-top {
  display:flex;
  align-items:center;
  gap:.65rem;
  flex-wrap:nowrap;
}
.t-disp {
  font-family: var(--mono);
  font-size:2.7rem;
  font-weight:500;
  letter-spacing:.04em;
  color: var(--text);
  line-height:1;
  min-width:105px;
  transition:color .2s;
}
.t-disp.running { color: var(--accent2); }
.t-disp.paused  { color: var(--muted); }
.t-btns { display:flex; gap:.45rem; align-items:center; width:100%; }
.t-btn {
  font-family: var(--head);
  font-size:.78rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.48rem .95rem;
  border-radius:8px;
  border:1px solid var(--border);
  color: var(--text);
  background: var(--surf2);
  transition:background .13s, border-color .13s, color .13s, transform .08s;
  white-space:nowrap;
  flex:1;
  text-align:center;
}
.t-btn-sm { padding:.48rem .7rem; }
.t-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); background: var(--accent-bg); }
.t-btn:active { transform:scale(0.94); }
.t-btn:disabled { opacity:.3; pointer-events:none; }
#btnStart.running { background: var(--accent); border-color: var(--accent); color:#fff; }
#btnStart.running:hover { filter:brightness(1.08); }
.half-badge {
  font-family: var(--mono);
  font-size:.65rem;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:3px 9px;
  border-radius:4px;
  background: var(--surf2);
  color: var(--muted);
  border:1px solid var(--border);
  white-space:nowrap;
  flex-shrink:0;
}
.half-badge.h1 { color: var(--accent2); border-color: var(--accent2); background: var(--accent-bg); }
.half-badge.h2 { color: var(--green2);  border-color: var(--green2);  background:rgba(34,197,94,.09); }

/* ─── INDEX ────────────────────────────────────────────────── */
.ix-hero {
  display:flex;
  align-items:baseline;
  gap:.3rem;
  line-height:1;
}
.ix-num {
  font-family: var(--mono);
  font-size:clamp(3.8rem,8vw,5.5rem);
  font-weight:500;
  color: var(--accent2);
  line-height:1;
  letter-spacing:-.02em;
  transition:color .3s;
}
.ix-unit {
  font-family: var(--head);
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color: var(--muted);
  padding-bottom:.35rem;
}
.stats-row {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:.55rem;
  margin-top:.85rem;
}
.sc {
  background: var(--surf2);
  border:1px solid var(--border);
  border-radius:9px;
  padding:.6rem .65rem;
  text-align:center;
}
.sc .sv {
  font-family: var(--mono);
  font-size:1.2rem;
  font-weight:500;
  color: var(--text);
  display:block;
  line-height:1.1;
}
.sc .sll {
  font-family: var(--head);
  font-size:.58rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color: var(--muted);
  display:block;
  margin-top:2px;
}
.target-row {
  display:flex;
  align-items:stretch;
  gap:.65rem;
  margin-top:.8rem;
  padding-top:.8rem;
  border-top:1px solid var(--border);
  flex-wrap:wrap;
}
.target-row label {
  font-family: var(--mono);
  font-size:.65rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color: var(--muted);
  flex-shrink:0;
  align-self:center;
}
.target-row input[type=number] {
  width:68px;
  background: var(--surf2);
  border:1px solid var(--border);
  color: var(--accent2);
  font-family: var(--mono);
  font-size:1.02rem;
  padding:.36rem .52rem;
  border-radius:8px;
  outline:none;
  transition:border-color .18s;
  -moz-appearance:textfield;
  box-sizing:border-box;
}
.target-row input::-webkit-outer-spin-button,
.target-row input::-webkit-inner-spin-button { -webkit-appearance:none; }
.target-row input:focus { border-color: var(--accent); }
#tStatus {
  font-family: var(--head);
  font-size:.73rem;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:.36rem .52rem;
  border-radius:8px;
  min-width:68px;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
}
#tStatus.above { background:rgba(34,197,94,.1); color: var(--green2); border:1px solid var(--green2); animation: badgeIn .2s ease both; }
#tStatus.below { background:rgba(192,57,43,.1); color: var(--danger2); border:1px solid var(--danger2); animation: badgeIn .2s ease both; }
#tStatus.meet  { background: var(--accent-bg); color: var(--accent2); border:1px solid var(--accent2); animation: badgeIn .2s ease both; }
#tStatus.none  { display:none; }
@keyframes badgeIn {
  from { transform:scale(.7); opacity:0; }
  to   { transform:scale(1);  opacity:1; }
}

/* ─── ACTION BUTTONS ───────────────────────────────────────── */
.act-grid { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.act-btn {
  font-family: var(--head);
  font-size:1.4rem;
  font-weight:800;
  letter-spacing:.04em;
  padding:1.25rem .9rem;
  border-radius:12px;
  border:1px solid var(--border);
  color: var(--text);
  background: var(--surf2);
  transition:background .1s, transform .08s, border-color .1s;
  text-transform:uppercase;
  text-align:center;
}
.act-btn span {
  display:block;
  font-family: var(--head);
  font-size:.58rem;
  font-weight:600;
  letter-spacing:.11em;
  color: var(--muted);
  margin-top:3px;
}
@media(max-width:860px) { .act-btn span { display:none; } }
.act-btn:active { transform:scale(0.94); }
.act-btn.add:hover { border-color: var(--accent2); background: var(--accent-bg); }
.act-btn.sub:hover { border-color: var(--accent2); color: var(--accent2); background: var(--accent-bg); }
.act-btn.add:active { background: var(--accent-bg); border-color: var(--accent2); }
.act-btn.sub { color: var(--muted); }

.opp-btn {
  width:100%;
  font-family: var(--head);
  font-size:1.05rem;
  font-weight:700;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:.95rem 1rem;
  border-radius:12px;
  border:1px solid var(--border);
  color: var(--text);
  background: var(--surf2);
  transition:background .1s, border-color .1s, color .1s, transform .08s;
  margin-top:.6rem;
  display:block;
  text-align:center;
}
.opp-btn span {
  display:block;
  font-size:.58rem;
  font-weight:600;
  letter-spacing:.11em;
  color: var(--muted);
  margin-top:3px;
}
@media(max-width:860px) { .opp-btn span { display:none; } }
@media(max-width:860px) {
  .opp-btn {
    padding:1.25rem .9rem;
    font-size:1.4rem;
  }
}
.opp-btn::before {
  content: '';
  display: inline-block;
  vertical-align: middle;
  margin-right: .45em;
  margin-bottom: .05em;
  /* Triangle (play) */
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 5px 0 5px 9px;
  border-color: transparent transparent transparent currentColor;
}
.opp-btn.active::before {
  /* Square (stop) */
  width: 9px;
  height: 9px;
  border: none;
  background: currentColor;
  border-radius: 1px;
}
.opp-btn.active {
  background:rgba(192,57,43,.1);
  border-color: var(--danger2);
  color: var(--danger2);
  animation: oppPulse 2.4s ease-in-out infinite;
}
@keyframes oppPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); }
  50%      { box-shadow: 0 0 0 4px rgba(231,76,60,.1); }
}
.opp-btn:not(.active):hover { border-color: var(--accent2); color: var(--accent2); background: var(--accent-bg); }
.opp-btn.active span { color:rgba(231,76,60,.55); }

/* ─── CHART ────────────────────────────────────────────────── */
.chart-wrap {
  position:relative;
  width:100%;
  height:100%;
  min-height:0;
}
@media(max-width:860px) { .chart-wrap { height:220px; min-height:220px; } }
canvas#chart { width:100%!important; height:100%!important; display:block; }

/* ─── PERIOD CARDS ─────────────────────────────────────────── */
.period-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.6rem;
}
.period-card {
  background: var(--surf2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:.8rem .75rem;
  text-align:center;
  transition:border-color .2s, background .2s;
}
.period-card .p-lbl {
  font-family: var(--head);
  font-size:.6rem;
  font-weight:700;
  letter-spacing:.11em;
  text-transform:uppercase;
  color: var(--muted);
  display:block;
  margin-bottom:4px;
}
.period-card .p-val {
  font-family: var(--mono);
  font-size:1.5rem;
  font-weight:500;
  color: var(--text);
  display:block;
}
.period-card .p-sub {
  font-family: var(--mono);
  font-size:.6rem;
  color: var(--muted);
  display:block;
  margin-top:3px;
}
.period-card.locked {
  border-color: var(--accent2);
  background: var(--accent-bg);
}
.period-card.locked .p-lbl { color: var(--accent2); }
.period-card.locked .p-val { color: var(--accent2); }
.period-card.locked-h2 {
  border-color: var(--accent2);
  background: var(--accent-bg);
}
.period-card.locked-h2 .p-lbl { color: var(--accent2); }
.period-card.locked-h2 .p-val { color: var(--accent2); }
.period-card.ft-above {
  border-color: var(--green2);
  background: rgba(34,197,94,.09);
}
.period-card.ft-above .p-lbl { color: var(--green2); }
.period-card.ft-above .p-val { color: var(--green2); }
.period-card.ft-below {
  border-color: var(--danger2);
  background: rgba(192,57,43,.09);
}
.period-card.ft-below .p-lbl { color: var(--danger2); }
.period-card.ft-below .p-val { color: var(--danger2); }

/* ─── REPORTS + RESET ──────────────────────────────────────── */
.bot-row {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:.55rem;
  align-items:stretch;
}
@media(max-width:560px) { .bot-row { grid-template-columns:1fr 1fr 1fr; } }
.rep-btn {
  font-family: var(--head);
  font-size:.77rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.65rem .6rem;
  border-radius:9px;
  border:1px solid var(--border);
  color: var(--text);
  background: var(--surf2);
  transition:background .13s, border-color .13s, transform .08s;
  width:100%;
}
.rep-btn:active { transform:scale(0.97); }
.rep-btn:hover:not(:disabled) { border-color: var(--accent2); color: var(--accent2); }
.rep-btn.pri:hover:not(:disabled) { filter:brightness(1.08); color:#fff; border-color: var(--accent); }
.rep-btn:disabled { opacity:.3; pointer-events:none; }
.rep-btn.pri { background: var(--accent); border-color: var(--accent); color:#fff; }
.rep-btn.pri:active { filter:brightness(1.1); }

/* ─── HOLD TO RESET ─────────────────────────────────────────── */
.reset-btn {
  position:relative;
  width:100%;
  height:100%;
  min-height:42px;
  flex-shrink:0;
  border-radius: var(--r);
  border:1px solid var(--border);
  background: var(--surf2);
  overflow:hidden;
  cursor:pointer;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  outline:none;
}
/* no mobile override needed — reset-btn fills grid cell */
.reset-btn-fill {
  position:absolute;
  top:0; left:0;
  height:100%;
  width:0%;
  background:rgba(192,57,43,.15);
  transition:background .2s;
  pointer-events:none;
}
.reset-btn-label {
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  gap:.5rem;
  font-family: var(--head);
  font-size:.72rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color: var(--muted);
  pointer-events:none;
  transition:color .2s;
}
.reset-btn-label .rbicon {
  font-size:.8rem;
  opacity:.5;
}
.reset-btn.holding .reset-btn-fill { background:rgba(192,57,43,.18); }
.reset-btn.holding .reset-btn-label { color: var(--danger2); }
.reset-btn:hover:not(.holding):not(.done) { border-color: var(--accent2); background: var(--accent-bg); }
.reset-btn:hover:not(.holding):not(.done) .reset-btn-label { color: var(--accent2); }
.reset-btn.done { border-color: var(--green2); }
.reset-btn.done .reset-btn-fill { background:rgba(34,197,94,.12); width:100%!important; }
.reset-btn.done .reset-btn-label { color: var(--green2); }

/* ─── FOOTER ───────────────────────────────────────────────── */
.footer {
  margin-top:.6rem;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:.5rem;
  font-family: var(--mono);
  font-size:.61rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  color: var(--muted2);
}

/* ─── MODAL ────────────────────────────────────────────────── */
.modal-ov {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:300;
  overflow-y:auto;
  padding:1.5rem 1rem;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.modal-ov.open { display:block; }
.modal-card {
  background:#fff;
  color:#111;
  max-width:980px;
  margin:0 auto;
  border-radius:14px;
  overflow:hidden;
  font-family:'Barlow',sans-serif;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.modal-hd {
  background:#0a0a0c;
  color:#fff;
  padding:1.1rem 1.5rem;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:1rem;
}
.modal-hd h2 {
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.45rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.04em;
  line-height:1;
}
.modal-hd .rbadge {
  font-family:'DM Mono',monospace;
  font-size:.66rem;
  color:#4a9eff;
  margin-top:4px;
  letter-spacing:.06em;
}
.close-modal {
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);
  color:#fff;
  font-size:1.05rem;
  width:30px; height:30px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition:background .15s;
}
.close-modal:hover { background:rgba(255,255,255,.16); }
.modal-body { padding:1.2rem 1.5rem; }
.r-layout {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.1rem;
  align-items:stretch;
}
.r-layout-chart {
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:1.1rem;
  align-items:stretch;
}
@media(max-width:560px) { .r-layout, .r-layout-chart { grid-template-columns:1fr; } }
.r-chart-col { display:flex; flex-direction:column; }
.r-metrics-col { display:flex; flex-direction:column; gap:.5rem; }
.r-mets-col { display:flex; flex-direction:column; gap:.5rem; margin-bottom:.5rem; }
.r-cw {
  background:#f8f9fb;
  border:1px solid #e4e6ea;
  border-radius:8px;
  padding:.75rem;
  margin-top:.75rem;
  flex:1;
  display:flex;
  flex-direction:column;
}
.r-cw img { width:100%; height:100%; display:block; border-radius:4px; object-fit:fill; }
.r-fx {
  border:1px solid #e4e6ea;
  border-radius:8px;
  padding:.75rem 1rem;
  margin-bottom:.9rem;
  background:#f8f9fb;
}
.r-fx-teams {
  font-family:'Barlow Condensed',sans-serif;
  font-size:1.2rem;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.02em;
}
.r-fx-meta {
  font-family:'DM Mono',monospace;
  font-size:.66rem;
  color:#777;
  margin-top:3px;
  line-height:1.6;
}
.rst {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.6rem;
  font-weight:700;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#aaa;
  padding-bottom:4px;
  border-bottom:1px solid #eee;
  margin-bottom:.6rem;
  margin-top:.85rem;
}
.rst:first-of-type { margin-top:0; }
.r-mets {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.5rem;
  margin-bottom:.75rem;
}
.r-met {
  background:#f3f4f6;
  border:1px solid #e8eaed;
  border-radius:7px;
  padding:.6rem .45rem;
  text-align:center;
}
.r-met.hl { background:#0a0a0c; border-color:#0a0a0c; }
.r-met.hl .mv { color:#4a9eff; }
.r-met.hl .ml { color:#777; }
.r-met .mv {
  font-family:'DM Mono',monospace;
  font-size:1.55rem;
  font-weight:500;
  color:#111;
  display:block;
  line-height:1;
}
.r-met .ml {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.58rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#777;
  display:block;
  margin-top:3px;
}
.modal-ft {
  background:#f3f4f6;
  padding:.8rem 1.5rem;
  display:flex;
  gap:.55rem;
  justify-content:flex-end;
  flex-wrap:wrap;
  align-items:center;
}
.m-btn {
  font-family:'Barlow Condensed',sans-serif;
  font-size:.77rem;
  font-weight:700;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:.52rem 1.05rem;
  border-radius:7px;
  cursor:pointer;
  border:1px solid #ccc;
  background:#fff;
  color:#444;
  transition:filter .13s;
}
.m-btn.pri { background:#1a73e8; color:#fff; border-color:#1a73e8; }
.m-btn:hover { filter:brightness(.95); }
.m-btn.pri:hover { filter:brightness(1.08); }

/* ─── FLASH ────────────────────────────────────────────────── */
@keyframes flash {
  0%   { filter:brightness(2.2) saturate(1.5); transform:scale(1.05); }
  100% { filter:brightness(1)   saturate(1);   transform:scale(1); }
}
.flashing { animation:flash .17s ease-out forwards; }
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <h1>Intensity Index Tracker</h1>
    <div class="topbar-right">
      <div id="fixturePill"></div>
      <button class="icon-btn" id="btnFxToggle">Fixture ▾</button>
    </div>
  </div>

  <!-- FIXTURE PANEL -->
  <div class="fx-panel" id="fxPanel">
    <div class="fx-inner">
      <div class="fx-grid">
        <div class="field fx-comp">
          <label>Competition</label>
          <input type="text" id="fxComp" placeholder="Joe McDonagh Cup" autocomplete="off"/>
        </div>
        <div class="field">
          <label>Team Tracked</label>
          <input type="text" id="fxHome" placeholder="Laois" autocomplete="off"/>
        </div>
        <div class="field">
          <label>Opposition</label>
          <input type="text" id="fxAway" placeholder="Opposition" autocomplete="off"/>
        </div>
        <div class="field">
          <label>Date</label>
          <input type="date" id="fxDate"/>
        </div>
        <div class="field">
          <label>Venue</label>
          <input type="text" id="fxVenue" placeholder="e.g. O'Moore Park" autocomplete="off"/>
        </div>
        <div class="field fx-save-cell">
          <label>&nbsp;</label>
          <button class="btn-save" id="btnFxSave">Save &amp; Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <!-- LEFT: Timer · Index · Actions -->
    <div class="col-l">

      <div class="card">
        <div class="sl">Match Timer</div>
        <div class="timer-row">
          <div class="timer-top">
            <div class="t-disp" id="tDisp">00:00</div>
            <div class="half-badge" id="halfBadge">Pre-Match</div>
          </div>
          <div class="t-btns">
            <button class="t-btn" id="btnStart">Start</button>
            <button class="t-btn" id="btnPause" disabled>Pause</button>
            <button class="t-btn t-btn-sm" id="btnHT" disabled>HT</button>
            <button class="t-btn t-btn-sm" id="btnFT" disabled style="display:none">FT</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="sl">Live Rating</div>
        <div class="ix-hero">
          <div class="ix-num" id="ixNum">—</div>
          <div class="ix-unit">II</div>
        </div>
        <div class="stats-row">
          <div class="sc"><span class="sv" id="stAct">0</span><span class="sll">Key Actions</span></div>
          <div class="sc"><span class="sv" id="stOpp">0:00</span><span class="sll">Opp Poss</span></div>
        </div>
        <div class="target-row">
          <label>Target</label>
          <input type="number" id="targetInput" value="6" min="0" max="99" step="0.5"/>
          <div id="tStatus" class="none"></div>
        </div>
      </div>

      <div class="card actions-card">
        <div class="sl">Tagging</div>
        <div class="act-grid">
          <button class="act-btn add" id="btnAdd">+1<span>Add Action [A]</span></button>
          <button class="act-btn sub" id="btnSub">−1<span>Remove [S]</span></button>
        </div>
        <button class="opp-btn" id="btnOpp">
          Start Opp Possession
          <span>Start / Stop &nbsp;[Space]</span>
        </button>
      </div>

    </div>

    <!-- RIGHT: Chart · Periods · Reports/Reset -->
    <div class="col-r">

      <div class="card chart-card">
        <div class="sl">Intensity Over Time</div>
        <div class="chart-wrap">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="sl">Period Summary</div>
        <div class="period-grid">
          <div class="period-card" id="cardH1">
            <span class="p-lbl">First Half</span>
            <span class="p-val" id="h1Val">—</span>
            <span class="p-sub" id="h1Sub">—</span>
          </div>
          <div class="period-card" id="cardH2">
            <span class="p-lbl">Second Half</span>
            <span class="p-val" id="h2Val">—</span>
            <span class="p-sub" id="h2Sub">—</span>
          </div>
          <div class="period-card" id="cardFT">
            <span class="p-lbl">Overall</span>
            <span class="p-val" id="ftVal">—</span>
            <span class="p-sub" id="ftSub">—</span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="sl">Reports &amp; Reset</div>
        <div class="bot-row">
            <button class="rep-btn" id="btnHTRep" disabled>HT Report</button>
            <button class="rep-btn" id="btnFTRep" disabled>FT Report</button>
            <button class="reset-btn" id="resetBtn" aria-label="Hold to reset">
              <div class="reset-btn-fill" id="resetFill"></div>
              <div class="reset-btn-label" id="resetLabel">
                <span class="rbicon">↺</span>
                <span id="resetText">Hold to Reset</span>
              </div>
            </button>
        </div>
      </div>

    </div>
  </div>

  <div class="footer">
    <span>Evan Dunne &thinsp;|&thinsp; Laois GAA</span>
    <span>evandunne74@gmail.com</span>
  </div>
</div>

<!-- HIDDEN PRINT CONTAINER -->
<div id="pdf-print"></div>

<!-- REPORT MODAL -->
<div class="modal-ov" id="repModal">
  <div class="modal-card" id="printArea">
    <div class="modal-hd">
      <div>
        <h2 id="repTitle">Report</h2>
        <div class="rbadge" id="repBadge">—</div>
      </div>
      <button class="close-modal" id="closeRep">✕</button>
    </div>
    <div class="modal-body" id="repBody"></div>
    <div class="modal-ft">
      <button class="m-btn" id="closeRep2">Close</button>
      <button class="m-btn pri" id="btnSaveRep">Save as Image</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
const S = {
  running: false,
  paused:  false,
  startMs: null,
  accumMs: 0,
  ht:      false,
  ft:      false,
  h1Act:   null,
  h1Opp:   null,
  h1Sec:   null,
  act:     0,
  oppMs:   null,
  oppAcc:  0,
  oppOn:   false,
  pts:     [],
  lastPt:  -999,
};

/* ══════════════════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════════════════ */
const matchMs  = () => S.running ? S.accumMs + (Date.now() - S.startMs) : S.accumMs;
const matchSec = () => matchMs() / 1000;
const mmStr = s => { s=Math.floor(s); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const oppNow = () => S.oppOn ? S.oppAcc + (Date.now() - S.oppMs)/1000 : S.oppAcc;
const totOpp = () => (S.h1Opp !== null ? S.h1Opp : 0) + oppNow();
const calcII = (a,m) => (!m||m<=0) ? null : Math.round((a/m)*10)/10;
const fmtII  = v => v===null ? '—' : v.toFixed(1);
const fmtOpp = s => { s=Math.max(0,s); return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); };
const haptic = ms => { if(navigator.vibrate) navigator.vibrate(ms); };
const fx = () => ({
  comp:  document.getElementById('fxComp').value.trim()||'',
  home:  document.getElementById('fxHome').value.trim()||'Laois',
  away:  document.getElementById('fxAway').value.trim()||'Opposition',
  date:  document.getElementById('fxDate').value,
  venue: document.getElementById('fxVenue').value.trim()||'',
});
const fmtDate = d => { if(!d) return ''; const[y,m,day]=d.split('-'); return `${day}/${m}/${y}`; };
const isDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

/* ══════════════════════════════════════════════════════════
   FIXTURE PANEL
══════════════════════════════════════════════════════════ */
let fxOpen = true;
const fxPanel = document.getElementById('fxPanel');
const fxPill  = document.getElementById('fixturePill');

function updatePill() {
  const home  = document.getElementById('fxHome').value.trim();
  const away  = document.getElementById('fxAway').value.trim();
  const comp  = document.getElementById('fxComp').value.trim();
  // Only show if the user has typed something meaningful
  if (home || away || comp) {
    const vs = `${home||'Laois'} v ${away||'Opposition'}`;
    fxPill.textContent = comp ? `${comp} · ${vs}` : vs;
    fxPill.style.display = 'block';
  } else {
    fxPill.style.display = 'none';
  }
}
document.getElementById('btnFxToggle').addEventListener('click', () => {
  fxOpen = !fxOpen;
  fxPanel.classList.toggle('collapsed', !fxOpen);
  document.getElementById('btnFxToggle').textContent = fxOpen ? 'Fixture ▴' : 'Fixture ▾';
});
document.getElementById('btnFxSave').addEventListener('click', () => {
  fxOpen = false;
  fxPanel.classList.add('collapsed');
  document.getElementById('btnFxToggle').textContent = 'Fixture ▾';
  updatePill();
});

/* ══════════════════════════════════════════════════════════
   TIMER
══════════════════════════════════════════════════════════ */
const btnStart = document.getElementById('btnStart');
const btnPause = document.getElementById('btnPause');
const btnHT    = document.getElementById('btnHT');
const btnFT    = document.getElementById('btnFT');
const tDisp    = document.getElementById('tDisp');
const hBadge   = document.getElementById('halfBadge');

btnStart.addEventListener('click', () => {
  if (!S.running) {
    S.startMs  = Date.now();
    S.running  = true;
    S.paused   = false;
    btnStart.textContent = 'Running';
    btnStart.classList.add('running');
    btnPause.disabled = false;
    btnHT.disabled    = false;
    tDisp.classList.remove('paused');
    tDisp.classList.add('running');
    hBadge.textContent = S.ht ? '2nd Half' : '1st Half';
    hBadge.className   = 'half-badge ' + (S.ht ? 'h2' : 'h1');
    btnPause.textContent = 'Pause';
  }
  haptic(20);
});

btnPause.addEventListener('click', () => {
  if (S.running) {
    S.accumMs += Date.now() - S.startMs;
    S.running  = false;
    S.paused   = true;
    if (S.oppOn) stopOpp();
    btnStart.textContent = 'Resume';
    btnStart.classList.remove('running');
    btnPause.textContent = 'Paused';
    tDisp.classList.remove('running');
    tDisp.classList.add('paused');
  } else if (S.paused) {
    // Resume via pause btn
    S.paused = false;
    btnPause.textContent = 'Pause';
    tDisp.classList.remove('paused');
    btnStart.click();
    return;
  }
  haptic(20);
});

btnHT.addEventListener('click', () => {
  if (S.ht) return;
  if (S.running) { S.accumMs += Date.now() - S.startMs; S.running = false; }
  if (S.oppOn) stopOpp();

  S.h1Act = S.act;
  S.h1Opp = S.oppAcc;
  S.h1Sec = matchSec();
  S.ht    = true;
  S.act   = 0;
  S.oppAcc = 0;
  S.oppOn  = false;
  S.oppMs  = null;

  btnStart.textContent = 'Start 2nd Half';
  btnStart.classList.remove('running');
  S.paused = false;
  tDisp.classList.remove('running','paused');
  btnPause.disabled    = true;
  btnPause.textContent = 'Pause';
  // Swap HT → FT button
  btnHT.style.display  = 'none';
  btnFT.style.display  = '';
  btnFT.disabled       = false;
  hBadge.textContent   = 'HT';
  hBadge.className     = 'half-badge';

  const btnHTRepEl = document.getElementById('btnHTRep');
  btnHTRepEl.disabled = false;
  btnHTRepEl.classList.add('pri');
  lockH1();
  render();
  saveSession();
  haptic(60);
});

btnFT.addEventListener('click', () => {
  // Stop everything first so all accumulators are finalised
  if (S.running) { S.accumMs += Date.now() - S.startMs; S.running = false; }
  if (S.oppOn) stopOpp();
  S.ft = true;

  btnStart.textContent = 'Full Time';
  btnStart.classList.remove('running');
  btnStart.disabled    = true;
  btnPause.disabled    = true;
  btnFT.disabled       = true;
  hBadge.textContent   = 'FT';
  hBadge.className     = 'half-badge';
  tDisp.classList.remove('running','paused');
  // Update opp button UI in case it was active
  btnOpp.innerHTML = 'Start Opp Possession<span>Start / Stop &nbsp;[Space]</span>';
  btnOpp.classList.remove('active');
  const btnFTRepEl = document.getElementById('btnFTRep');
  btnFTRepEl.disabled = false;
  btnFTRepEl.classList.add('pri');

  // Lock H2 card — read oppAcc now that stopOpp() has finalised it
  const h2Opp = S.oppAcc;
  const h2II  = calcII(S.act, h2Opp/60);
  document.getElementById('h2Val').textContent = fmtII(h2II);
  document.getElementById('h2Sub').textContent = h2Opp>0 ? `${S.act} Key Actions · ${fmtOpp(h2Opp)}` : `${S.act} Key Actions`;
  document.getElementById('cardH2').classList.add('locked-h2');

  // Highlight Overall based on target
  const tgt    = parseFloat(document.getElementById('targetInput').value);
  const tAct   = (S.h1Act||0) + S.act;
  const tOpp   = (S.h1Opp||0) + h2Opp;
  const ftII   = calcII(tAct, tOpp/60);
  const cardFT = document.getElementById('cardFT');
  cardFT.classList.remove('ft-above','ft-below');
  if (ftII !== null && !isNaN(tgt) && tgt > 0) {
    cardFT.classList.add(ftII >= tgt ? 'ft-above' : 'ft-below');
  }

  render();
  saveSession();
  haptic(60);
});

/* ══════════════════════════════════════════════════════════
   OPP POSSESSION
══════════════════════════════════════════════════════════ */
const btnOpp = document.getElementById('btnOpp');
function stopOpp() {
  S.oppAcc += (Date.now() - S.oppMs) / 1000;
  S.oppOn   = false;
  S.oppMs   = null;
}
function toggleOpp() {
  if (!S.oppOn) {
    S.oppMs = Date.now();
    S.oppOn  = true;
    btnOpp.innerHTML = 'Stop Opp Possession<span>Start / Stop &nbsp;[Space]</span>';
    btnOpp.classList.add('active');
  } else {
    stopOpp();
    btnOpp.innerHTML = 'Start Opp Possession<span>Start / Stop &nbsp;[Space]</span>';
    btnOpp.classList.remove('active');
  }
  haptic(30);
}
btnOpp.addEventListener('click', toggleOpp);

/* ══════════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════════ */
function addAct() {
  S.act++;
  render();
  saveSession();
  flash(document.getElementById('btnAdd'));
  haptic(22);
}
function subAct() {
  if (S.act > 0) S.act--;
  render();
  saveSession();
  flash(document.getElementById('btnSub'));
  haptic(22);
}
document.getElementById('btnAdd').addEventListener('click', addAct);
document.getElementById('btnSub').addEventListener('click', subAct);

function flash(btn) {
  btn.classList.remove('flashing');
  void btn.offsetWidth;
  btn.classList.add('flashing');
  setTimeout(() => btn.classList.remove('flashing'), 200);
}

/* ══════════════════════════════════════════════════════════
   KEYBOARD
══════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
  if (e.key==='a'||e.key==='A') { e.preventDefault(); addAct(); }
  if (e.key==='s'||e.key==='S') { e.preventDefault(); subAct(); }
  if (e.key===' ')               { e.preventDefault(); toggleOpp(); }
  if ((e.key==='p'||e.key==='P')&&!btnPause.disabled) { e.preventDefault(); btnPause.click(); }
});

/* ══════════════════════════════════════════════════════════
   CHART
══════════════════════════════════════════════════════════ */
const cv  = document.getElementById('chart');
const ctx = cv.getContext('2d');
let DPR = window.devicePixelRatio||1;

function sizeCanvas() {
  DPR = window.devicePixelRatio||1;
  const wrap = cv.parentElement;
  const W = wrap.clientWidth;
  const H = wrap.clientHeight;
  if (W === 0 || H === 0) return; // not laid out yet
  cv.width  = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

// Use ResizeObserver to catch flex-driven size changes
if (window.ResizeObserver) {
  new ResizeObserver(() => { sizeCanvas(); drawChart(); }).observe(cv.parentElement);
}
window.addEventListener('resize', () => { sizeCanvas(); drawChart(); });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => drawChart());

// Defer initial sizing until after layout is painted
requestAnimationFrame(() => { sizeCanvas(); drawChart(); });

// Hover tooltip — desktop only
let chartHoverX = undefined;
cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  chartHoverX = (e.clientX - rect.left) * (cv.width / rect.width) / DPR;
  drawChart(chartHoverX);
});
cv.addEventListener('mouseleave', () => {
  chartHoverX = undefined;
  drawChart();
});

function recordPt() {
  const sec = matchSec();
  if (sec - S.lastPt < 10) return;
  const ii = calcII((S.h1Act||0)+S.act, totOpp()/60);
  if (ii !== null) { S.pts.push({x:sec/60, y:ii}); S.lastPt = sec; }
}

function drawChart(hoverX) {
  const W = cv.width/DPR, H = cv.height/DPR;
  const P = {t:14,r:18,b:28,l:38};
  const dark = isDark();
  const target = parseFloat(document.getElementById('targetInput').value)||0;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = dark ? '#141416' : '#ffffff';
  ctx.fillRect(0,0,W,H);

  const pts = [...S.pts];
  const lii = calcII((S.h1Act||0)+S.act, totOpp()/60);
  if (matchSec()>0 && lii!==null) pts.push({x:matchSec()/60, y:lii});

  // Clean integer x-axis: find a nice step size
  const rawMax = pts.length ? pts[pts.length-1].x : 0;
  const xMax = Math.max(rawMax * 1.06, target>0?6:5, 5);
  const yMax = Math.max(target>0?target*1.5:0, pts.length?Math.max(...pts.map(p=>p.y))*1.25:2, 2);
  const toX = v => P.l + (v/xMax)*(W-P.l-P.r);
  const toY = v => P.t + (1-v/yMax)*(H-P.t-P.b);
  const fromX = px => (px - P.l) / (W-P.l-P.r) * xMax;

  const gc = dark?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)';
  const lc = dark?'rgba(255,255,255,.28)':'rgba(0,0,0,.38)';

  // Y axis
  ctx.font = '10px DM Mono,monospace';
  for (let i=0;i<=4;i++) {
    const v=(i/4)*yMax, y=toY(v);
    ctx.strokeStyle=gc; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(P.l,y); ctx.lineTo(W-P.r,y); ctx.stroke();
    ctx.fillStyle=lc; ctx.textAlign='right';
    ctx.fillText(v.toFixed(1),P.l-5,y+4);
  }

  // X axis — clean integer minute labels
  const step = xMax <= 10 ? 1 : xMax <= 20 ? 2 : xMax <= 40 ? 5 : 10;
  for (let m=0; m<=Math.ceil(xMax); m+=step) {
    if (toX(m) > W-P.r+2) break;
    ctx.fillStyle=lc; ctx.textAlign='center'; ctx.font='10px DM Mono,monospace';
    ctx.fillText(m+"'", toX(m), H-P.b+14);
  }

  // HT line
  if (S.h1Sec) {
    const hx = toX(S.h1Sec/60);
    // Solid blue line, slightly thicker
    ctx.strokeStyle = 'rgba(74,158,255,0.55)';
    ctx.setLineDash([4,3]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(hx,P.t); ctx.lineTo(hx,H-P.b); ctx.stroke();
    ctx.setLineDash([]);
    // Small badge label
    ctx.font = 'bold 9px Barlow Condensed,sans-serif';
    const lw = ctx.measureText('HT').width + 8;
    const lh = 14, ly = P.t;
    const lx = hx - lw/2;
    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(lx, ly, lw, lh, 3);
    else ctx.rect(lx, ly, lw, lh);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('HT', hx, ly + lh - 3);
  }

  // Target line
  if (target>0) {
    const ty=toY(target);
    if (ty>=P.t&&ty<=H-P.b) {
      ctx.strokeStyle='#22c55e'; ctx.setLineDash([5,5]); ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(P.l,ty); ctx.lineTo(W-P.r,ty); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#22c55e'; ctx.font='9px DM Mono,monospace'; ctx.textAlign='right';
      ctx.fillText('Target '+target, W-P.r-3, ty-4);
    }
  }

  // Data line + fill
  if (pts.length>1) {
    ctx.beginPath(); ctx.moveTo(toX(pts[0].x),toY(pts[0].y));
    for (let i=1;i<pts.length;i++) {
      const p=pts[i-1],q=pts[i],mx=(toX(p.x)+toX(q.x))/2;
      ctx.bezierCurveTo(mx,toY(p.y),mx,toY(q.y),toX(q.x),toY(q.y));
    }
    ctx.strokeStyle='#4a9eff'; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
    ctx.lineTo(toX(pts[pts.length-1].x),toY(0));
    ctx.lineTo(toX(pts[0].x),toY(0));
    ctx.closePath();
    const g=ctx.createLinearGradient(0,P.t,0,H-P.b);
    g.addColorStop(0,'rgba(74,158,255,.2)'); g.addColorStop(1,'rgba(74,158,255,.01)');
    ctx.fillStyle=g; ctx.fill();
  }

  // Live pulse dot only (no historical dots)
  if (pts.length > 0 && S.running) {
    const lp = pts[pts.length-1];
    ctx.beginPath(); ctx.arc(toX(lp.x),toY(lp.y),5,0,Math.PI*2);
    ctx.fillStyle='#4a9eff'; ctx.fill();
    ctx.beginPath(); ctx.arc(toX(lp.x),toY(lp.y),9,0,Math.PI*2);
    ctx.strokeStyle='rgba(74,158,255,.22)'; ctx.lineWidth=1.5; ctx.stroke();
  }

  // Hover tooltip (desktop)
  if (hoverX !== undefined && pts.length > 1) {
    const hm = fromX(hoverX);
    // Find closest point
    let closest = pts[0], minDist = Infinity;
    for (const p of pts) {
      const d = Math.abs(p.x - hm);
      if (d < minDist) { minDist = d; closest = p; }
    }
    if (minDist < xMax * 0.08) {
      const cx = toX(closest.x), cy = toY(closest.y);
      // Vertical guide line
      ctx.strokeStyle = dark?'rgba(255,255,255,.15)':'rgba(0,0,0,.12)';
      ctx.setLineDash([2,3]); ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cx,P.t); ctx.lineTo(cx,H-P.b); ctx.stroke();
      ctx.setLineDash([]);
      // Dot
      ctx.beginPath(); ctx.arc(cx,cy,4,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.fill();
      ctx.strokeStyle='#4a9eff'; ctx.lineWidth=2; ctx.stroke();
      // Tooltip box
      const label = `${closest.x.toFixed(1)}' · ${closest.y.toFixed(1)}`;
      ctx.font='bold 11px DM Mono,monospace';
      const tw = ctx.measureText(label).width;
      const tp = 6, th = 20, tr = 4;
      let tx = cx - tw/2 - tp;
      if (tx < P.l) tx = P.l;
      if (tx + tw + tp*2 > W-P.r) tx = W-P.r - tw - tp*2;
      const ty2 = cy - th - 8;
      ctx.fillStyle = dark?'#1c1c1f':'#111';
      ctx.beginPath();
      ctx.roundRect(tx, ty2, tw+tp*2, th, tr);
      ctx.fill();
      ctx.fillStyle='#fff';
      ctx.textAlign='left';
      ctx.fillText(label, tx+tp, ty2+th-5);
    }
  }
}

/* ══════════════════════════════════════════════════════════
   LOCK H1
══════════════════════════════════════════════════════════ */
function lockH1() {
  const ii = calcII(S.h1Act, (S.h1Opp||0)/60);
  document.getElementById('h1Val').textContent = fmtII(ii);
  document.getElementById('h1Sub').textContent = S.h1Opp>0 ? `${S.h1Act} Key Actions · ${fmtOpp(S.h1Opp)}` : `${S.h1Act} Key Actions`;
  document.getElementById('cardH1').classList.add('locked');
}

/* ══════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════ */
function render() {
  const tms  = matchMs();
  const ts   = Math.floor(tms/1000);
  tDisp.textContent = String(Math.floor(ts/60)).padStart(2,'0')+':'+String(ts%60).padStart(2,'0');

  const h2Opp = oppNow();
  const tOpp  = totOpp();
  const h2Act = S.act;
  const tAct  = (S.h1Act||0) + h2Act;
  const h2II  = calcII(h2Act, h2Opp/60);
  const ftII  = calcII(tAct, tOpp/60);
  // Live Rating always shows overall (full game) score
  const disp  = ftII;

  document.getElementById('ixNum').textContent  = fmtII(disp);
  document.getElementById('stAct').textContent  = tAct;
  document.getElementById('stOpp').textContent  = fmtOpp(tOpp);

  const tgt = parseFloat(document.getElementById('targetInput').value);
  const ts2 = document.getElementById('tStatus');
  if (!isNaN(tgt)&&tgt>0&&disp!==null) {
    if (disp>tgt+.05)      { ts2.textContent='↑ Above'; ts2.className='above'; }
    else if(disp<tgt-.05)  { ts2.textContent='↓ Below'; ts2.className='below'; }
    else                   { ts2.textContent='On Target'; ts2.className='meet'; }
  } else { ts2.className='none'; }

  // Period summary cards
  // H1: show live during 1st half; locked after HT
  if (!S.ht) {
    // During 1st half — update H1 card live
    const liveH1II = calcII(S.act, oppNow()/60);
    document.getElementById('h1Val').textContent = fmtII(liveH1II);
    document.getElementById('h1Sub').textContent = oppNow()>0 ? `${S.act} Key Actions · ${fmtOpp(oppNow())}` : `${S.act} Key Actions`;
  }
  // H2: only show after halftime
  if (S.ht) {
    document.getElementById('h2Val').textContent = fmtII(h2II);
    document.getElementById('h2Sub').textContent = h2Opp>0?`${h2Act} Key Actions · ${fmtOpp(h2Opp)}`:`${h2Act} Key Actions`;
  }
  // Overall: always show total
  document.getElementById('ftVal').textContent = fmtII(ftII);
  document.getElementById('ftSub').textContent = tOpp>0?`${tAct} Key Actions · ${fmtOpp(tOpp)}`:`${tAct} Key Actions`;

  if (S.running) recordPt();
  drawChart(chartHoverX);
}

/* ══════════════════════════════════════════════════════════
   OFFSCREEN REPORT CHART (landscape, 900×320)
══════════════════════════════════════════════════════════ */
function buildChart(pts, target, htSec) {
  const W=900,H=520, sc=2;
  const oc=document.createElement('canvas');
  oc.width=W*sc; oc.height=H*sc;
  const c=oc.getContext('2d'); c.scale(sc,sc);
  const P={t:16,r:24,b:42,l:56};
  const xMax=Math.max(pts.length?pts[pts.length-1].x*1.06:10,1);
  const yMax=Math.max(target>0?target*1.5:0,pts.length?Math.max(...pts.map(p=>p.y))*1.25:2,2);
  const toX=v=>P.l+(v/xMax)*(W-P.l-P.r);
  const toY=v=>P.t+(1-v/yMax)*(H-P.t-P.b);

  c.fillStyle='#f7f8fa'; c.fillRect(0,0,W,H);
  c.font='13px DM Mono,monospace';
  for(let i=0;i<=4;i++){
    const v=(i/4)*yMax,y=toY(v);
    c.strokeStyle='#e0e3e8';c.lineWidth=1;
    c.beginPath();c.moveTo(P.l,y);c.lineTo(W-P.r,y);c.stroke();
    c.fillStyle='#666';c.textAlign='right';c.fillText(v.toFixed(1),P.l-8,y+4);
  }
  for(let i=0;i<=6;i++){
    const v=(i/6)*xMax;
    c.fillStyle='#666';c.font='13px DM Mono,monospace';c.textAlign='center';c.fillText(Math.round(v)+"'",toX(v),H-P.b+18);
  }
  if(htSec){
    const hx=toX(htSec/60);
    c.strokeStyle='#bbb';c.setLineDash([3,4]);c.lineWidth=1;
    c.beginPath();c.moveTo(hx,P.t);c.lineTo(hx,H-P.b);c.stroke();
    c.setLineDash([]);
    c.fillStyle='#999';c.font='12px Barlow Condensed,sans-serif';c.textAlign='center';
    c.fillText('HT',hx,P.t+11);
  }
  if(target>0){
    const ty=toY(target);
    c.strokeStyle='#22c55e';c.setLineDash([6,5]);c.lineWidth=1.5;
    c.beginPath();c.moveTo(P.l,ty);c.lineTo(W-P.r,ty);c.stroke();
    c.setLineDash([]);
    c.fillStyle='#22c55e';c.font='12px DM Mono,monospace';c.textAlign='right';
    c.fillText('Target '+target, W-P.r-4, ty-6);
  }
  if(pts.length>1){
    c.beginPath();c.moveTo(toX(pts[0].x),toY(pts[0].y));
    for(let i=1;i<pts.length;i++){
      const p=pts[i-1],q=pts[i],mx=(toX(p.x)+toX(q.x))/2;
      c.bezierCurveTo(mx,toY(p.y),mx,toY(q.y),toX(q.x),toY(q.y));
    }
    c.strokeStyle='#1a73e8';c.lineWidth=2.5;c.stroke();
    c.lineTo(toX(pts[pts.length-1].x),toY(0));c.lineTo(toX(pts[0].x),toY(0));c.closePath();
    const g=c.createLinearGradient(0,P.t,0,H-P.b);
    g.addColorStop(0,'rgba(26,115,232,.18)');g.addColorStop(1,'rgba(26,115,232,.01)');
    c.fillStyle=g;c.fill();
  }
  pts.forEach(p=>{c.beginPath();c.arc(toX(p.x),toY(p.y),3,0,Math.PI*2);c.fillStyle='rgba(26,115,232,.55)';c.fill();});
  return oc.toDataURL('image/png');
}

/* ══════════════════════════════════════════════════════════
   REPORT
══════════════════════════════════════════════════════════ */
function genReport(type) {
  const f=fx(), tgt=parseFloat(document.getElementById('targetInput').value)||0;
  const h1II=calcII(S.h1Act,(S.h1Opp||0)/60);
  const h2Opp=oppNow(), h2Act=S.act;
  const h2II=calcII(h2Act,h2Opp/60);
  const ftAct=(S.h1Act||0)+h2Act, ftOpp=totOpp();
  const ftII=calcII(ftAct,ftOpp/60);
  const htSec=S.h1Sec, ftSec=matchSec();

  const fxB=`<div class="r-fx">
    <div class="r-fx-teams">${f.home} <span style="color:#bbb;font-size:.85em">v</span> ${f.away}</div>
    <div class="r-fx-meta">${[f.comp,fmtDate(f.date),f.venue].filter(Boolean).join(' · ')}</div>
  </div>`;

  let L='',R='';

  if(type==='ht'){
    document.getElementById('repTitle').textContent='Half Time Report';
    document.getElementById('repBadge').textContent=[f.home+' v '+f.away, f.comp, fmtDate(f.date), f.venue].filter(Boolean).join(' · ');
    const diff=h1II!==null?h1II-tgt:null;
    const col=diff!==null?(diff>=0?'#22c55e':'#e74c3c'):'#888';

    const p1=[...S.pts.filter(p=>htSec===null||p.x<=htSec/60+.3)];
    if(htSec&&h1II!==null) p1.push({x:htSec/60,y:h1II});
    const chartImg = p1.length>1 ? `<img src="${buildChart(p1,tgt,null)}"/>` :
      '<div style="color:#aaa;font-size:.85rem;padding:2rem;text-align:center">Not enough data</div>';

    // metrics HTML (stacked single column for sidebar)
    const metricsHTML = `
      <div class="rst">Metrics</div>
      <div class="r-mets r-mets-col">
        <div class="r-met hl"><span class="mv">${fmtII(h1II)}</span><span class="ml">Intensity Index</span></div>
        <div class="r-met"><span class="mv">${S.h1Act}</span><span class="ml">Key Actions</span></div>
        <div class="r-met"><span class="mv">${fmtOpp(S.h1Opp||0)}</span><span class="ml">Opp Possession</span></div>
      </div>
      ${tgt>0?`<div class="rst">Target</div><div class="r-mets r-mets-col">
        <div class="r-met"><span class="mv">${tgt}</span><span class="ml">Target II</span></div>
        <div class="r-met"><span class="mv" style="color:${col}">${diff!==null?(diff>=0?'+':'')+diff.toFixed(1):'—'}</span><span class="ml">vs Target</span></div>
        <div class="r-met"><span class="mv" style="color:${col}">${h1II!==null&&h1II>=tgt?'✓':'✗'}</span><span class="ml">Met Target</span></div>
      </div>`:''}`;

    L = `<div class="r-chart-col r-cw">${chartImg}</div>`;
    R = `<div class="r-metrics-col">${metricsHTML}</div>`;
  }

  if(type==='ft'){
    document.getElementById('repTitle').textContent='Full Time Report';
    document.getElementById('repBadge').textContent=[f.home+' v '+f.away, f.comp, fmtDate(f.date), f.venue].filter(Boolean).join(' · ');
    const diff=ftII!==null?ftII-tgt:null;
    const col=diff!==null?(diff>=0?'#22c55e':'#e74c3c'):'#888';

    const allP=[...S.pts];
    if(ftSec>0&&ftII!==null) allP.push({x:ftSec/60,y:ftII});
    const chartImg = allP.length>1 ? `<img src="${buildChart(allP,tgt,htSec)}"/>` :
      '<div style="color:#aaa;font-size:.85rem;padding:2rem;text-align:center">Not enough data</div>';

    const metricsHTML = `
      <div class="rst">Summary</div>
      <div class="r-mets r-mets-col">
        ${S.h1Act!==null?`
        <div class="r-met"><span class="mv">${fmtII(h1II)}</span><span class="ml">1st Half II</span></div>
        <div class="r-met"><span class="mv">${fmtII(h2II)}</span><span class="ml">2nd Half II</span></div>`:''}
        <div class="r-met hl"><span class="mv">${fmtII(ftII)}</span><span class="ml">Full Time II</span></div>
      </div>
      <div class="rst">Actions</div>
      <div class="r-mets r-mets-col">
        ${S.h1Act!==null?`
        <div class="r-met"><span class="mv">${S.h1Act}</span><span class="ml">H1 Actions</span></div>
        <div class="r-met"><span class="mv">${h2Act}</span><span class="ml">H2 Actions</span></div>`:''}
        <div class="r-met"><span class="mv">${ftAct}</span><span class="ml">Total</span></div>
      </div>
      <div class="rst">Possession</div>
      <div class="r-mets r-mets-col">
        ${S.h1Opp!==null?`
        <div class="r-met"><span class="mv">${fmtOpp(S.h1Opp)}</span><span class="ml">H1 Opp Poss</span></div>
        <div class="r-met"><span class="mv">${fmtOpp(h2Opp)}</span><span class="ml">H2 Opp Poss</span></div>`:''}
        <div class="r-met"><span class="mv">${fmtOpp(ftOpp)}</span><span class="ml">Total</span></div>
      </div>
      ${tgt>0?`<div class="rst">Target</div><div class="r-mets r-mets-col">
        <div class="r-met"><span class="mv">${tgt}</span><span class="ml">Target II</span></div>
        <div class="r-met"><span class="mv" style="color:${col}">${diff!==null?(diff>=0?'+':'')+diff.toFixed(1):'—'}</span><span class="ml">vs Target</span></div>
        <div class="r-met"><span class="mv" style="color:${col}">${ftII!==null&&ftII>=tgt?'✓':'✗'}</span><span class="ml">Met Target</span></div>
      </div>`:''}`;

    L = `<div class="r-chart-col r-cw">${chartImg}</div>`;
    R = `<div class="r-metrics-col">${metricsHTML}</div>`;
  }

  document.getElementById('repBody').innerHTML = `<div class="r-layout r-layout-chart">${L}${R}</div>`;
  document.getElementById('repModal').classList.add('open');
}

/* ══════════════════════════════════════════════════════════
   SAVE AS IMAGE — html2canvas screenshot of modal
══════════════════════════════════════════════════════════ */
document.getElementById('btnSaveRep').addEventListener('click', async () => {
  const btn = document.getElementById('btnSaveRep');
  btn.textContent = 'Saving…';
  btn.disabled = true;

  try {
    const modalCard  = document.getElementById('printArea');
    const modalFt    = modalCard.querySelector('.modal-ft');
    const closeBtn   = modalCard.querySelector('.close-modal');
    // Hide UI chrome during capture
    if (modalFt)  modalFt.style.visibility  = 'hidden';
    if (closeBtn) closeBtn.style.visibility = 'hidden';

    const canvas = await html2canvas(modalCard, {
      scale: 3,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false,
      windowWidth: modalCard.scrollWidth,
      windowHeight: modalCard.scrollHeight,
    });

    if (modalFt)  modalFt.style.visibility  = '';
    if (closeBtn) closeBtn.style.visibility = '';

    const f       = fx();
    const title   = document.getElementById('repTitle').textContent;
    const dateStr = new Date().toLocaleDateString('en-IE').replace(/\//g, '-');
    const fname   = `${title.replace(/\s+/g,'-')}_${f.home}-v-${f.away}_${dateStr}.png`;

    canvas.toBlob(blob => {
      const url  = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href     = url;
      link.download = fname;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }, 'image/png');

  } catch (err) {
    console.error('Image export error:', err);
    alert('Could not save image. Please try again.');
  }

  btn.textContent = 'Save as Image';
  btn.disabled    = false;
});




/* ══════════════════════════════════════════════════════════
   HOLD TO RESET
══════════════════════════════════════════════════════════ */
(function(){
  const btn   = document.getElementById('resetBtn');
  const fill  = document.getElementById('resetFill');
  const text  = document.getElementById('resetText');
  const HOLD_MS = 1200; // ms to hold before reset fires
  let holdTimer = null;
  let startTime = null;
  let rafId     = null;
  let active    = false;

  function startHold(e) {
    if (e.type === 'touchstart') e.preventDefault();
    active    = true;
    startTime = Date.now();
    btn.classList.add('holding');
    haptic(10);
    function tick() {
      if (!active) return;
      const elapsed = Date.now() - startTime;
      const pct = Math.min(elapsed / HOLD_MS, 1);
      fill.style.width = (pct * 100) + '%';
      if (pct >= 1) {
        cancelAnimationFrame(rafId);
        doReset();
      } else {
        rafId = requestAnimationFrame(tick);
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function endHold() {
    if (!active) return;
    active = false;
    cancelAnimationFrame(rafId);
    btn.classList.remove('holding');
    // Animate fill back to 0
    fill.style.transition = 'width .25s ease';
    fill.style.width = '0%';
    setTimeout(() => { fill.style.transition = ''; }, 260);
  }

  btn.addEventListener('mousedown',  startHold);
  btn.addEventListener('touchstart', startHold, {passive:false});
  btn.addEventListener('mouseup',    endHold);
  btn.addEventListener('mouseleave', endHold);
  btn.addEventListener('touchend',   endHold);
  btn.addEventListener('touchcancel',endHold);

  function doReset() {
    active = false;
    btn.classList.remove('holding');
    Object.assign(S, {
      running:false, paused:false, startMs:null, accumMs:0,
      ht:false, ft:false, h1Act:null, h1Opp:null, h1Sec:null,
      act:0, oppMs:null, oppAcc:0, oppOn:false,
      pts:[], lastPt:-999,
    });
    // UI reset
    btnStart.textContent='Start'; btnStart.className='t-btn'; btnStart.disabled=false;
    btnPause.disabled=true; btnPause.textContent='Pause';
    btnHT.disabled=true; btnHT.style.display=''; btnHT.textContent='HT';
    btnFT.disabled=true; btnFT.style.display='none';
    tDisp.textContent='00:00'; tDisp.className='t-disp';
    hBadge.textContent='Pre-Match'; hBadge.className='half-badge';
    btnOpp.innerHTML='Start Opp Possession<span>Start / Stop &nbsp;[Space]</span>';
    btnOpp.classList.remove('active');
    document.getElementById('btnHTRep').disabled=true;
    document.getElementById('btnHTRep').classList.remove('pri');
    document.getElementById('btnFTRep').disabled=true;
    document.getElementById('btnFTRep').classList.remove('pri');
    ['h1Val','h2Val','ftVal'].forEach(id=>document.getElementById(id).textContent='—');
    ['h1Sub','h2Sub','ftSub'].forEach(id=>document.getElementById(id).textContent='—');
    document.getElementById('cardH1').classList.remove('locked');
    document.getElementById('cardH2').classList.remove('locked-h2');
    document.getElementById('cardFT').classList.remove('ft-above','ft-below');
    haptic(80);

    // Done state
    btn.classList.add('done');
    fill.style.width = '100%';
    text.textContent = '✓ Reset';

    setTimeout(() => {
      btn.classList.remove('done');
      fill.style.transition = 'width .3s ease';
      fill.style.width = '0%';
      text.textContent = 'Hold to Reset';
      setTimeout(() => { fill.style.transition = ''; }, 320);
    }, 1400);

    render();
    document.dispatchEvent(new Event('sessionReset'));
  }
})();

/* ══════════════════════════════════════════════════════════
   LOCAL STORAGE — auto-save & restore
══════════════════════════════════════════════════════════ */
const LS_KEY = 'iit_session_v1';

function saveSession() {
  try {
    const data = {
      S: {
        running: false,  // never restore as running — timer needs a fresh start
        paused:  S.paused,
        accumMs: S.running ? S.accumMs + (Date.now() - S.startMs) : S.accumMs,
        ht:      S.ht,
        ft:      S.ft,
        h1Act:   S.h1Act,
        h1Opp:   S.h1Opp,
        h1Sec:   S.h1Sec,
        act:     S.act,
        oppAcc:  S.oppOn ? S.oppAcc + (Date.now() - S.oppMs)/1000 : S.oppAcc,
        oppOn:   false,  // never restore opp as active
        pts:     S.pts,
        lastPt:  S.lastPt,
      },
      fx: {
        comp:  document.getElementById('fxComp').value,
        home:  document.getElementById('fxHome').value,
        away:  document.getElementById('fxAway').value,
        date:  document.getElementById('fxDate').value,
        venue: document.getElementById('fxVenue').value,
      },
      target: document.getElementById('targetInput').value,
      savedAt: Date.now(),
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  } catch(e) { /* storage full or private mode */ }
}

function clearSession() {
  try { localStorage.removeItem(LS_KEY); } catch(e) {}
}

function restoreSession() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);

    // Don't restore if session is more than 12 hours old
    if (Date.now() - data.savedAt > 12 * 60 * 60 * 1000) {
      clearSession();
      return false;
    }

    // Restore state
    Object.assign(S, data.S);
    S.startMs = null;
    S.oppMs   = null;

    // Restore fixture fields
    if (data.fx) {
      document.getElementById('fxComp').value  = data.fx.comp  || '';
      document.getElementById('fxHome').value  = data.fx.home  || '';
      document.getElementById('fxAway').value  = data.fx.away  || '';
      document.getElementById('fxDate').value  = data.fx.date  || '';
      document.getElementById('fxVenue').value = data.fx.venue || '';
    }
    if (data.target) {
      document.getElementById('targetInput').value = data.target;
    }

    // Restore UI state
    if (S.accumMs > 0 || S.ht || S.ft) {
      const ts = Math.floor(S.accumMs/1000);
      tDisp.textContent = String(Math.floor(ts/60)).padStart(2,'0')+':'+String(ts%60).padStart(2,'0');
      btnStart.textContent = S.ft ? 'Full Time' : (S.ht ? 'Start 2nd Half' : 'Resume');
      if (S.ft) { btnStart.disabled = true; }
      btnPause.disabled = S.ft;
      btnHT.disabled = true;

      if (S.ht && !S.ft) {
        btnHT.style.display = 'none';
        btnFT.style.display = '';
        btnFT.disabled = false;
        hBadge.textContent = 'Half Time'; hBadge.className = 'half-badge';
      } else if (S.ft) {
        btnHT.style.display = 'none';
        btnFT.style.display = '';
        btnFT.disabled = true;
        hBadge.textContent = 'FT'; hBadge.className = 'half-badge';
      } else {
        hBadge.textContent = '1st Half'; hBadge.className = 'half-badge h1';
      }

      if (S.ht) {
        lockH1();
        document.getElementById('btnHTRep').disabled = false;
        document.getElementById('btnHTRep').classList.add('pri');
      }
      if (S.ft) {
        document.getElementById('btnFTRep').disabled = false;
        document.getElementById('btnFTRep').classList.add('pri');
        // Re-lock H2 card
        const h2II = calcII(S.act, S.oppAcc/60);
        document.getElementById('h2Val').textContent = fmtII(h2II);
        document.getElementById('h2Sub').textContent = S.oppAcc>0?`${S.act} Key Actions · ${fmtOpp(S.oppAcc)}`:`${S.act} Key Actions`;
        document.getElementById('cardH2').classList.add('locked-h2');
        // Re-colour Overall card
        const tgt  = parseFloat(document.getElementById('targetInput').value)||0;
        const tAct = (S.h1Act||0)+S.act;
        const tOpp = totOpp();
        const ftII = calcII(tAct,tOpp/60);
        const cFT  = document.getElementById('cardFT');
        if (ftII!==null&&tgt>0) cFT.classList.add(ftII>=tgt?'ft-above':'ft-below');
      }

      // Auto-collapse fixture panel and show pill if details present
      updatePill();
      if (data.fx && (data.fx.home || data.fx.away || data.fx.comp)) {
        fxOpen = false;
        document.getElementById('fxPanel').classList.add('collapsed');
        document.getElementById('btnFxToggle').textContent = 'Fixture ▾';
      }
    }

    return true;
  } catch(e) {
    clearSession();
    return false;
  }
}

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
// Set default date first, then try to restore
document.getElementById('fxDate').value = new Date().toISOString().split('T')[0];

const restored = restoreSession();
if (!restored) {
  // Fresh session — nothing to do
}

document.getElementById('targetInput').addEventListener('input', () => { render(); saveSession(); });

setInterval(()=>{
  if(S.running||S.oppOn) render();
  // Auto-save every 5s when session is active
  if(S.accumMs > 0 || S.act > 0 || S.oppAcc > 0) saveSession();
}, 5000);

// Also save immediately on key interactions
setInterval(()=>{ if(S.running||S.oppOn) render(); }, 250);
render();
</script>
